name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    - cron: '0 4,10 * * *'

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install pypushdeer

    # 执行 签到脚本
    - name: Running checkin
      id: checkin
      run: |
        set +e
        python checkin.py 2>&1 | tee "$RUNNER_TEMP/checkin.log"
        checkin_status=${PIPESTATUS[0]}
        echo "exit_code=$checkin_status" >> "$GITHUB_OUTPUT"
        exit "$checkin_status"
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY || secrets.SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES || secrets.COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN || secrets.EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
        GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT || vars.GLADOS_USER_AGENT }}
        # 签到域名 (可选): secret 或 repository variable, 未设置时签到 glados.cloud 与 railgun.info
        GLADOS_DOMAINS: ${{ secrets.GLADOS_DOMAINS || vars.GLADOS_DOMAINS }}
        GLADOS_ALLOW_CUSTOM_DOMAINS: ${{ secrets.GLADOS_ALLOW_CUSTOM_DOMAINS || vars.GLADOS_ALLOW_CUSTOM_DOMAINS }}

    # 签到失败 (或之前的步骤失败) 时通过 Poke 告警, 需要 POKE_API_KEY secret
    - name: Alert via Poke
      if: failure()
      env:
        POKE_API_KEY: ${{ secrets.POKE_API_KEY }}
        CHECKIN_EXIT_CODE: ${{ steps.checkin.outputs.exit_code }}
      run: |
        if [ -z "$POKE_API_KEY" ]; then
          echo "::error::POKE_API_KEY secret is not set; cannot send the Poke failure alert."
          exit 1
        fi
        log_file="$RUNNER_TEMP/checkin.log"
        safe_log_file="$RUNNER_TEMP/checkin-alert.log"
        if [ -f "$log_file" ]; then
          # Preserve diagnostic wording; mask cookie/session values rather than dropping lines.
          python - "$log_file" "$safe_log_file" <<'PY'
        import re
        import sys
        from pathlib import Path

        source, destination = map(Path, sys.argv[1:])
        text = source.read_text(errors="replace")
        patterns = (
            r'(?i)(gld:sess(?:\.sig)?|koa:sess(?:\.sig)?)=([^;\\s]+)',
            r'(?i)(cookie\\s*[:=]\\s*)([^\\r\\n]+)',
            r'(?i)((?:authorization|token|secret|password)\\s*[:=]\\s*)([^\\s,;]+)',
        )
        for pattern in patterns:
            text = re.sub(pattern, lambda m: m.group(1) + "***", text)
        destination.write_text(text[:6000])
        PY
        else
          printf '%s' 'Check-in log file was not produced. The check-in step may not have run.' > "$safe_log_file"
        fi
        jq -n --arg exit_code "${CHECKIN_EXIT_CODE:-unknown}" \
          --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --rawfile log "$safe_log_file" \
          '{message: ("Check-in failed (exit code " + $exit_code + "). Check-in diagnostics (credential values masked; truncated to 6000 bytes):\n" + $log + "\nRun: " + $run_url)}' > "$RUNNER_TEMP/poke-payload.json"
        curl --fail-with-body -sS 'https://poke.com/api/v1/inbound/api-message' \
          -H "Authorization: Bearer $POKE_API_KEY" \
          -H "Content-Type: application/json" \
          --data-binary "@$RUNNER_TEMP/poke-payload.json"

    - name: Keep alive
      uses: liskin/gh-workflow-keepalive@v1

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
